<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAME.WEB</title>
    <link rel="stylesheet" href="/componenets/background.css" />
    <link rel="stylesheet" href="/componenets/btn.css" />
    <link rel="stylesheet" href="/login-page/login.css" />
    <link rel="stylesheet" href="/componenets/heading.css" />
    <script type="module" src="/login-page/login.js" defer></script>
  </head>

  <body>
    <h1 class="welcome glow-pulse">WELCOME TO GAME.WEB</h1>

    <div class="login-container">
      <h3 class="welcome glow-pulse">LOGIN TO GAME.WEB</h3>

      <p class="glow-pulse"> Email</p>
      <input type="email" placeholder="enter valid email" class="input email" />

      <p class="glow-pulse">password</p>
      <div class="password-wrapper">
        <input
          type="password"
          placeholder="enter password"
          class="input pass"
        />

        <span class="show-pass">
          <img src="/assets/images/view.png" alt="show password" />
        </span>
      </div>

      <div class="btn-container">
        <button class="btn sign-in">log in</button>
      </div>
    </div>
  </body>
</html>
